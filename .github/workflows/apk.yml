name: APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Construir APK
        working-directory: android
        env:
          VC: ${{ github.run_number }}
        run: gradle assembleAleRelease assembleJonRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Preparar archivo
        run: |
          cp android/app/build/outputs/apk/ale/release/app-ale-release.apk nuestro-lugar.apk
          cp android/app/build/outputs/apk/jon/release/app-jon-release.apk nuestro-lugar-jon.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Nuestro lugar (Android)
          body: "App de Android de nuestro lugar 💗 (vc=${{ github.run_number }})"
          files: |
            nuestro-lugar.apk
            nuestro-lugar-jon.apk
          make_latest: true
      - name: Publicar copia para descargar desde Vercel (dl/)
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch -q origin main && git checkout -q -B pub origin/main
          mkdir -p dl && cp nuestro-lugar.apk nuestro-lugar-jon.apk dl/ && echo '{"vc":${{ github.run_number }}}' > dl/version.json
          git add dl && git commit -qm "App v${{ github.run_number }} lista para descargar"
          for i in 1 2 3 4; do git push -q origin pub:main && break; sleep 5; git fetch -q origin main && git rebase -q origin/main; done
          git checkout -q ${{ github.sha }}
      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/test-emulador.sh
      - name: Guardar resultado de la prueba
        if: always()
        run: |
          mkdir -p /tmp/out && cp android/build.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q -b apk-log && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "prueba ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk-log
