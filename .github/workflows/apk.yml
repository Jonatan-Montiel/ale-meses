name: APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    # write: solo los pasos de publicar (release y push de dl/) lo necesitan; es un solo job.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.9'
      - name: Preparar llave de firma (desde los secretos)
        env:
          NL_SIGN: ${{ secrets.NL_SIGN }}
        run: |
          if [ -z "$NL_SIGN" ]; then echo "::error::Falta el secreto NL_SIGN"; exit 1; fi
          P="${NL_SIGN%%:*}"; echo "::add-mask::$P"
          printf %s "${NL_SIGN#*:}" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/nl.jks"
          echo "NL_KEY_PASS=$P" >> "$GITHUB_ENV"
      - name: Construir APK
        working-directory: android
        env:
          VC: ${{ github.run_number }}
          NL_KS: ${{ runner.temp }}/nl.jks
        run: gradle assembleAleRelease assembleJonRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Preparar archivo
        run: |
          cp android/app/build/outputs/apk/ale/release/app-ale-release.apk nuestro-lugar.apk
          cp android/app/build/outputs/apk/jon/release/app-jon-release.apk nuestro-lugar-jon.apk
      - name: Borrar llave del runner
        if: always()
        run: rm -f "$RUNNER_TEMP/nl.jks"
      - name: Activar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash android/test-emulador.sh
      - name: Preparar resumen de la prueba
        if: always()
        run: |
          mkdir -p /tmp/out
          tail -n 200 android/build.log > /tmp/out/build-cola.txt 2>/dev/null || true
          # Solo el resumen: nada de logcat completo, volcados de UI ni capturas.
          mkdir -p /tmp/resumen
          for f in resultado.txt errores.txt install.txt start.txt pid.txt build-cola.txt; do
            cp "/tmp/out/$f" /tmp/resumen/ 2>/dev/null || true
          done
      - name: Guardar resultado de la prueba (artefacto, 7 dias)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultado-prueba-${{ github.run_number }}
          path: /tmp/resumen
          retention-days: 7
          if-no-files-found: ignore
      - name: Publicar descarga
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: apk
          name: Nuestro lugar (Android)
          body: "App de Android de nuestro lugar 💗 (vc=${{ github.run_number }})"
          files: |
            nuestro-lugar.apk
            nuestro-lugar-jon.apk
          make_latest: true
      - name: Publicar copia para descargar desde Vercel (dl/)
        run: |
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git fetch -q origin main && git checkout -q -B pub origin/main
          mkdir -p dl && cp nuestro-lugar.apk nuestro-lugar-jon.apk dl/ && echo '{"vc":${{ github.run_number }}}' > dl/version.json
          git add dl && git commit -qm "App v${{ github.run_number }} lista para descargar"
          for i in 1 2 3 4; do git push -q origin pub:main && break; sleep 5; git fetch -q origin main && git rebase -q origin/main; done
          git checkout -q ${{ github.sha }}
