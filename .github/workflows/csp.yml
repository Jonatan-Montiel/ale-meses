name: CSP
on:
  push:
    branches: [main]
    paths: ['index.html']
permissions:
  contents: read
concurrency:
  group: csp
  cancel-in-progress: false
jobs:
  hash:
    runs-on: ubuntu-latest
    # write: este job hace push del index.html con el hash nuevo.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que la CSP tenga el hash del script
        run: |
          if python3 tools/csp.py --check; then echo "CSP al día"; exit 0; fi
          python3 tools/csp.py
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add index.html && git commit -qm "CSP: actualizar hash del script"
          ok=0
          for i in 1 2 3; do git push -q origin HEAD:main && { ok=1; break; }; sleep 5; git pull -q --rebase origin main; python3 tools/csp.py; git add index.html; git commit -qm "CSP: actualizar hash del script" || true; done
          if [ "$ok" != 1 ]; then echo "::error::No se pudo publicar el hash de la CSP tras varios intentos"; exit 1; fi
