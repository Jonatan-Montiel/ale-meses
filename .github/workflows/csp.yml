name: CSP
on:
  push:
    branches: [main]
    paths: ['index.html']
permissions:
  contents: write
concurrency:
  group: csp
  cancel-in-progress: false
jobs:
  hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar que la CSP tenga el hash del script
        run: |
          if python3 tools/csp.py --check; then echo "CSP al día"; exit 0; fi
          python3 tools/csp.py
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add index.html && git commit -qm "CSP: actualizar hash del script"
          for i in 1 2 3; do git push -q origin HEAD:main && break; sleep 5; git pull -q --rebase origin main; python3 tools/csp.py; git add index.html; git commit -qm "CSP: actualizar hash del script" || true; done
