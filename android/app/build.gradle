plugins { id 'com.android.application' }
android {
  namespace 'com.jon.nuestrolugar'
  compileSdk 34
  defaultConfig {
    applicationId 'com.jon.nuestrolugar'
    minSdk 24
    targetSdk 34
    versionCode Integer.parseInt(System.getenv('VC') ?: '1')
    versionName '1.' + (System.getenv('VC') ?: '1')
  }
  signingConfigs {
    // La llave vive SOLO en los secretos de GitHub (NL_SIGN); nunca en el repo
    rel { storeFile file(System.getenv('NL_KS') ?: 'sin-llave.jks'); storePassword System.getenv('NL_KEY_PASS') ?: ''; keyAlias 'nl'; keyPassword System.getenv('NL_KEY_PASS') ?: '' }
  }
  buildFeatures { buildConfig true }
  flavorDimensions 'rol'
  productFlavors {
    ale { dimension 'rol'; buildConfigField 'String', 'WHO', '"ella"'; resValue 'string', 'app_name', 'Nuestro lugar' }
    jon { dimension 'rol'; applicationIdSuffix '.jon'; buildConfigField 'String', 'WHO', '"yo"'; resValue 'string', 'app_name', 'Nuestro lugar · Jon' }
  }
  buildTypes { release { minifyEnabled false; signingConfig signingConfigs.rel } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  lint { abortOnError false; checkReleaseBuilds false }
}
